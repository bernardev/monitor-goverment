# Ambiente local completo (ADR-0013). Uso: docker compose -f infra/docker/docker-compose.yml up -d
name: prometeu

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: prometeu
      POSTGRES_USER: prometeu_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desenvolvimento}
    ports:
      # Troque com POSTGRES_PORTA se a máquina já tiver um PostgreSQL na 5432.
      - '${POSTGRES_PORTA:-5432}:5432'
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prometeu_admin -d prometeu']
      interval: 5s
      timeout: 3s
      retries: 20

  # Armazenamento de objetos S3-compatível para bronze, capturas e vídeos (ADR-0005, ADR-0009).
  objetos:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-prometeu}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-desenvolvimento}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - objetos:/data

  # Identidade e acesso (ADR-0014). O realm `prometeu` é importado de ./keycloak na primeira subida.
  identidade:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-desenvolvimento}
      KC_HTTP_PORT: '8080'
    ports:
      - '${KEYCLOAK_PORTA:-8080}:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Plataforma de dados (ADR-0005): o daemon dispara as agendas das coletas e avisa as falhas pelo
  # webhook de ALERTA_WEBHOOK_URL. Perfil próprio, para subir só quando for coletar:
  #   docker compose -f infra/docker/docker-compose.yml --profile dados up -d
  dados:
    profiles: [dados]
    build: ../../data-platform
    environment: &ambiente-dos-dados
      INGESTAO_DATABASE_URL: postgresql://ctx_ingestao:desenvolvimento@postgres:5432/prometeu
      S3_ENDPOINT: http://objetos:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-prometeu}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-desenvolvimento}
      ALERTA_WEBHOOK_URL: ${ALERTA_WEBHOOK_URL:-}
    volumes:
      - dagster:/opt/dagster/historico
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Interface do Dagster: execuções, agendas e a carga histórica (http://localhost:3070).
  dados-interface:
    profiles: [dados]
    build: ../../data-platform
    command: ['dagster-webserver', '-h', '0.0.0.0', '-p', '3070', '-m', 'prometeu_dados.definicoes']
    environment: *ambiente-dos-dados
    ports:
      - '${DAGSTER_PORTA:-3070}:3070'
    volumes:
      - dagster:/opt/dagster/historico
    depends_on:
      - dados

volumes:
  postgres:
  objetos:
  dagster:
