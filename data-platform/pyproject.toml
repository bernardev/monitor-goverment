[project]
name = "prometeu-dados"
version = "0.0.0"
description = "Plataforma de dados do Prometeu: conectores das fontes oficiais, camadas bronze e prata (ADR-0005)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13.27",
]

[dependency-groups]
dev = [
    "dagster-webserver>=1.13.27",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prometeu_dados"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PTH", "DTZ"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "prometeu_dados"

[[tool.importlinter.contracts]]
name = "Camadas: definicoes > conectores > bronze"
type = "layers"
layers = [
    "prometeu_dados.definicoes",
    "prometeu_dados.conectores",
    "prometeu_dados.bronze",
]
