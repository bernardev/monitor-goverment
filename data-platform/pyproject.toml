[project]
name = "prometeu-dados"
version = "0.0.0"
description = "Plataforma de dados do Prometeu: conectores das fontes oficiais, camadas bronze e prata (ADR-0005)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.122",
    "dagster>=1.13.27",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
# Para os contêineres do Dagster: a interface web. O daemon vem com o `dagster`.
operacao = [
    "dagster-webserver>=1.13.27",
]
dev = [
    "boto3-stubs[s3]>=1.43.122",
    "dagster-webserver>=1.13.27",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prometeu_dados"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PTH", "DTZ"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integracao: usa PostgreSQL real via Testcontainers (exige Docker)"]

[tool.importlinter]
root_package = "prometeu_dados"

[[tool.importlinter.contracts]]
name = "Camadas: definicoes > adaptadores e ingestao > conectores > prata e rede > bronze"
type = "layers"
layers = [
    "prometeu_dados.definicoes",
    "prometeu_dados.adaptadores | prometeu_dados.ingestao",
    "prometeu_dados.conectores",
    "prometeu_dados.prata | prometeu_dados.rede",
    "prometeu_dados.bronze",
]
